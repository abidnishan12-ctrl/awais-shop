<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWAIS</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--c:#F3EBDD;--w:#FBF7EF;--s:#E4D6BE;--k:#241C15;--a:#5B5F3A}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font:400 15px/1.6 'DM Sans',sans-serif;background:var(--c);color:var(--k)}
h1,h2,h3,.f{font-family:'Bodoni Moda',serif;font-weight:500}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-block;padding:13px 28px;border:1px solid var(--k);background:var(--k);color:var(--c);border-radius:2px;cursor:pointer;transition:.35s}
.btn:hover{background:var(--a);border-color:var(--a)}
.btn.o{background:none;color:var(--k)}.btn.o:hover{background:var(--k);color:var(--c)}
nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 5vw;background:#f3ebddeb;backdrop-filter:blur(10px);border-bottom:1px solid var(--s)}
.lg{display:flex;align-items:center;gap:10px;color:var(--a)}.lg b{color:var(--k);font-size:22px;letter-spacing:.3em}
.m{display:flex;gap:20px;align-items:center}
.m a{position:relative;font-size:14px}
.m a:after{content:"";position:absolute;left:0;bottom:-3px;height:1px;width:0;background:var(--a);transition:.35s}
.m a:hover:after,.m a.on:after{width:100%}
#cb{background:var(--a);color:#fff;border-radius:20px;padding:0 7px;font-size:12px;margin-left:3px}
#cb.bump{animation:bp .4s}
@keyframes bp{50%{transform:scale(1.5)}}
@media(max-width:640px){nav{flex-direction:column}.m{gap:16px}}
#app{opacity:0;transform:translateY(12px);transition:.5s}#app.in{opacity:1;transform:none}
.sec{padding:60px 5vw;max-width:1150px;margin:auto}.nar{max-width:560px}.c{text-align:center}
.sec h2{font-size:34px;margin-bottom:24px}
.hero{position:relative;min-height:86vh;display:grid;place-items:center;text-align:center;overflow:hidden;padding:20px}
.hero:before{content:"";position:absolute;inset:-10%;background:radial-gradient(circle at 30% 30%,#fff7e6,transparent 45%),radial-gradient(circle at 75% 70%,var(--s),transparent 50%);animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.2) translate(-3%,2%)}}
.orb{position:absolute;width:42vw;height:42vw;border-radius:50%;background:#5b5f3a22;filter:blur(60px);top:-10%;right:-10%;animation:fl 12s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(-8vw,10vh)}}
.big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 30vw/1 'Bodoni Moda',serif;color:transparent;-webkit-text-stroke:1px #5b5f3a33;letter-spacing:.05em}
.hc{position:relative;max-width:640px}
.hc h1{font-size:clamp(38px,8vw,72px);line-height:1.08;margin:14px 0}
.hc h1 span{display:inline-block;opacity:0;transform:translateY(40px);filter:blur(8px);animation:rise 1.2s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(2.9s + var(--d))}
.hc p,.hc .btn,.hc .lg{opacity:0;animation:fade 1.2s forwards;animation-delay:3.6s}
.hc .lg{justify-content:center;animation-delay:2.7s;font-size:0}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
@keyframes fade{to{opacity:1}}
.hc p{margin-bottom:24px}
.mq{overflow:hidden;border-block:1px solid var(--s);padding:12px 0;background:var(--w)}
.mq div{display:inline-block;white-space:nowrap;animation:mq 26s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:20px}
.card h3{font-size:17px;margin-top:10px}.card p{display:flex;justify-content:space-between;color:#6b5d4d}.card b{color:var(--k)}
.im{aspect-ratio:3/4;overflow:hidden;background:var(--s);display:grid;place-items:center}
.im img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.card:hover .im img{transform:scale(1.07)}
.ph{font:500 60px 'Bodoni Moda',serif;color:var(--a);opacity:.5}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chips a{padding:6px 16px;border:1px solid var(--s);border-radius:30px}.chips a.on{background:var(--k);color:var(--c)}
.pd{display:grid;gap:36px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.th{display:flex;gap:8px;margin-top:8px}.th img{width:64px;height:64px;object-fit:cover;cursor:pointer}
.info h1{font-size:36px}.info h2{font-size:26px;margin:6px 0 14px;color:var(--a)}.info p{margin-bottom:18px;white-space:pre-line}
.sz,.pm{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sz label,.pm label{cursor:pointer}.sz input,.pm input{display:none}
.sz span,.pm span{display:block;padding:8px 16px;border:1px solid var(--s);background:var(--w);transition:.3s}
input:checked+span{background:var(--k);color:var(--c);border-color:var(--k)}
.qty{display:flex;align-items:center;gap:14px;margin-bottom:18px}.qty button{width:34px;height:34px;border:1px solid var(--s);background:var(--w);cursor:pointer}
.acts{display:flex;gap:10px;flex-wrap:wrap}.acts .btn{flex:1}
.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--s)}.row>div:nth-child(2){flex:1}.sm{width:70px;aspect-ratio:3/4}
.tot{display:flex;justify-content:space-between;padding:10px 0}
.fm{display:flex;flex-direction:column;gap:12px}.fm label{display:flex;flex-direction:column;gap:4px;font-size:13px}
.fm input:not([type=radio]),.fm textarea,.fm select{padding:13px;border:1px solid var(--s);background:var(--w);border-radius:2px;width:100%}
.tick{width:70px;height:70px;border-radius:50%;background:var(--a);color:#fff;font-size:36px;display:grid;place-items:center;margin:0 auto 18px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.ord{display:flex;gap:12px;justify-content:space-between;padding:14px;margin-bottom:10px;background:var(--w);border:1px solid var(--s);font-size:14px}
.ord select{height:40px;width:auto}
footer{border-top:1px solid var(--s);padding:34px 5vw;text-align:center;color:#6b5d4d}footer .lg{justify-content:center;margin-bottom:8px}
#t{position:fixed;left:50%;bottom:24px;transform:translate(-50%,90px);background:var(--k);color:var(--c);padding:12px 22px;z-index:99;transition:.4s}#t.s{transform:translate(-50%,0)}
#sp{position:fixed;inset:0;z-index:100;display:grid;place-items:center;pointer-events:none}
#sp i{position:absolute;left:0;right:0;height:50%;background:var(--c);transition:transform 1s cubic-bezier(.8,0,.2,1)}
#sp i:first-child{top:0}#sp i:nth-child(2){bottom:0}
#sp.go i:first-child{transform:translateY(-100%)}#sp.go i:nth-child(2){transform:translateY(100%)}
#sp .sl{position:relative;z-index:2;text-align:center;color:var(--a);transition:.6s}#sp.go .sl{opacity:0;transform:scale(1.2)}
#sp b{display:block;font-size:30px;letter-spacing:.4em;margin-top:10px;color:var(--k);opacity:0;animation:fade 1s .9s forwards}
.d{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.6s ease forwards}.d2{animation-delay:.5s}
@keyframes dr{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}
</style></head><body>
<div id="sp"><i></i><i></i><div class="sl"><div id="spl"></div><b class="f">AWAIS</b></div></div>
<nav><a href="#/" class="lg" id="nl"></a>
<div class="m"><a href="#/">Home</a><a href="#/shop">Shop</a><a href="#/about">About</a><a href="#/contact">Contact</a><a href="#/cart">Cart<span id="cb">0</span></a></div></nav>
<main id="app"></main>
<footer><a href="#/" class="lg" id="fl"></a><p>© AWAIS · Made in Bangladesh</p><p><a href="#/track">Track your order</a></p><p><a href="#/admin"><small>Admin</small></a></p></footer>
<div id="t"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG={
    apiKey: "AIzaSyAASM7JVyUrpi9jzfNFOfXZ1G8AMVKA3DI",
    authDomain: "awaisclothing25.firebaseapp.com",
    projectId: "awaisclothing25",
    storageBucket: "awaisclothing25.firebasestorage.app",
    messagingSenderId: "966705290359",
    appId: "1:966705290359:web:b3984b19698be3445bfa72"
  };
const DEMO_PASS='admin123';
const $=s=>document.querySelector(s),app=$('#app');
const money=n=>'৳'+Number(n).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOGO=(z,dr)=>`<svg width="${z}" height="${z}" viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="30" r="27" pathLength="1" ${dr?'class="d"':''}/><path pathLength="1" ${dr?'class="d d2"':''} d="M30 25v-4.5a3.5 3.5 0 1 1 3.5-3.5M14 45l16-20 16 20M20.5 38h19"/></svg>`;
const LS=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):localStorage.setItem(k,JSON.stringify(v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const oid=i=>'AW-'+String(i).slice(-5).toUpperCase();
const newNo=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return 'AW'+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+'-'+(100+Math.floor(Math.random()*900))};
const DEF={hero:'Dress quietly. Be remembered.',sub:'Timeless clothing made for everyday elegance.',about:'AWAIS is a Bangladeshi clothing brand. We design simple, comfortable pieces from quality fabric, made to last.',wa:'8801XXXXXXXXX',phone:'+880 1XXX-XXXXXX',addr:'Dhaka, Bangladesh',ship:100,pay:'Send money to bKash/Nagad 01XXXXXXXXX (Personal), then enter the Transaction ID.'};
const DEMO=[['Classic Panjabi','Panjabi',1850],['Linen Shirt','Shirt',1450],['Cotton Kurti','Kurti',1250],['Everyday Tee','T-shirt',650]].map(([name,cat,price],i)=>({id:'d'+i,name,cat,price,sizes:'S,M,L,XL',desc:'Soft, breathable fabric with a clean fit.\nAdd your own details in the admin panel.',imgs:[],t:i}));
let db=null,au=null;
if(FIREBASE_CONFIG&&window.firebase){firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();au=firebase.auth();au.onAuthStateChanged(()=>{if(location.hash=='#/admin')route()})}
const API={
 async products(){if(db)return(await db.collection('products').orderBy('t','desc').get()).docs.map(d=>({id:d.id,...d.data()}));let p=LS('aw_p');if(!p){p=DEMO;LS('aw_p',p)}return p},
 async saveP(p){p.t=p.t||Date.now();if(db){const{id,...r}=p;id?await db.collection('products').doc(id).set(r):await db.collection('products').add(r);return}
  const a=await this.products();p.id?a.splice(a.findIndex(x=>x.id==p.id),1,p):a.unshift({...p,id:uid()});LS('aw_p',a)},
 async delP(id){if(db)return db.collection('products').doc(id).delete();LS('aw_p',(await this.products()).filter(x=>x.id!=id))},
 async settings(){if(db){const d=await db.collection('settings').doc('main').get();return{...DEF,...d.data()}}return{...DEF,...LS('aw_s')}},
 async saveS(s){db?await db.collection('settings').doc('main').set(s):LS('aw_s',s)},
 async addOrder(o){o.t=Date.now();o.status='New';o.no=newNo();o.id=o.no;if(db){await db.collection('orders').doc(o.no).set(o);await db.collection('track').doc(o.no).set({status:'New'})}else{LS('aw_o',[o,...(LS('aw_o')||[])]);LS('aw_t',{...(LS('aw_t')||{}),[o.no]:'New'})}return o.no},
 async orders(){if(db)return(await db.collection('orders').orderBy('t','desc').get()).docs.map(d=>({id:d.id,...d.data()}));return LS('aw_o')||[]},
 async setStatus(id,s){if(db){await db.collection('orders').doc(id).update({status:s});return db.collection('track').doc(id).set({status:s},{merge:true})}LS('aw_o',(LS('aw_o')||[]).map(o=>o.id==id?{...o,status:s}:o));LS('aw_t',{...(LS('aw_t')||{}),[id]:s})},
 watch(cb){if(db)db.collection('orders').onSnapshot(s=>cb(s.docs));else setInterval(async()=>cb(await this.orders()),3000)},
 isAdmin(){return db?!!au.currentUser:!!LS('aw_adm')},
 async login(e,p){if(db)return au.signInWithEmailAndPassword(e,p);if(p!=DEMO_PASS)throw 0;LS('aw_adm',1)},
 logout(){db?au.signOut():LS('aw_adm',0);location.reload()}
};
let P=null,S=null;
const load=async f=>{if(f||!P){P=await API.products();S=await API.settings()}};
const cart=()=>LS('aw_c')||[];
const setCart=c=>{LS('aw_c',c);const b=$('#cb');b.textContent=c.reduce((a,i)=>a+i.q,0);b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')};
const sub=()=>cart().reduce((a,i)=>{const p=P.find(x=>x.id==i.id);return a+(p?p.price*i.q:0)},0);
const toast=t=>{const e=$('#t');e.textContent=t;e.classList.add('s');clearTimeout(toast.i);toast.i=setTimeout(()=>e.classList.remove('s'),2600)};
const beep=()=>{try{const a=new AudioContext,o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.4)}catch(e){}};
const pic=f=>new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};i.src=URL.createObjectURL(f)});
const img=(p,i=0)=>p.imgs&&p.imgs[i]?`<img src="${p.imgs[i]}" alt="${esc(p.name)}">`:`<div class="ph">${esc(p.name[0])}</div>`;
const card=p=>`<a class="card" href="#/product/${p.id}"><div class="im">${img(p)}</div><h3>${esc(p.name)}</h3><p><span>${esc(p.cat)}</span><b>${money(p.price)}</b></p></a>`;
const nf=()=>`<section class="sec c"><h2>Page not found</h2><a class="btn" href="#/">Go home</a></section>`;

function home(){const w=S.hero.split(' ').map((x,i)=>`<span style="--d:${i*.14}s">${esc(x)}</span> `).join('');const m='New arrivals ✦ Cash on delivery ✦ Premium fabric ✦ Delivery all over Bangladesh ✦ ';
return `<section class="hero"><div class="orb"></div><div class="big">AWAIS</div><div class="hc"><div class="lg">${LOGO(64)}</div><h1>${w}</h1><p>${esc(S.sub)}</p><a class="btn" href="#/shop">Shop the collection</a></div></section>
<div class="mq"><div>${m.repeat(8)}</div></div>
<section class="sec"><h2>Featured</h2>${P.length?`<div class="grid">${P.slice(0,4).map(card).join('')}</div>`:'<p>Products are coming soon.</p>'}<p class="c" style="margin-top:30px"><a class="btn o" href="#/shop">View all</a></p></section>`}
function shop(c){c=c?decodeURIComponent(c):'';const cats=[...new Set(P.map(p=>p.cat))],L=P.filter(p=>!c||p.cat==c);
return `<section class="sec"><h2>Shop</h2><div class="chips"><a href="#/shop" class="${c?'':'on'}">All</a>${cats.map(x=>`<a href="#/shop/${encodeURIComponent(x)}" class="${x==c?'on':''}">${esc(x)}</a>`).join('')}</div>${L.length?`<div class="grid">${L.map(card).join('')}</div>`:'<p>No products yet.</p>'}</section>`}
function product(id){const p=P.find(x=>x.id==id);if(!p)return nf();const z=(p.sizes||'').split(',').map(s=>s.trim()).filter(Boolean),colors=(p.colors||'').split(',').map(s=>s.trim()).filter(Boolean);
return `<section class="sec pd"><div class="gal"><div class="im" id="mi">${img(p)}</div><div class="th">${(p.imgs||[]).map(s=>`<img src="${s}" onclick="$('#mi img').src=this.src">`).join('')}</div></div>
<div class="info"><small>${esc(p.cat)}</small><h1>${esc(p.name)}</h1><h2>${money(p.price)}</h2><p>${esc(p.desc)}</p>
<div class="sz">${z.map((s,i)=>`<label><input type="radio" name="sz" value="${esc(s)}" ${i?'':'checked'}><span>${esc(s)}</span></label>`).join('')}</div>
${colors.length?`<p style="margin:18px 0 8px"><b>Color</b></p><div class="sz colors">${colors.map((c,i)=>`<label><input type="radio" name="color" value="${esc(c)}" ${i?'':'checked'}><span>${esc(c)}</span></label>`).join('')}</div>`:''}
<div class="qty"><button onclick="qd(-1)">−</button><b id="q">1</b><button onclick="qd(1)">+</button></div>
<div class="acts"><button class="btn o" onclick="add('${p.id}')">Add to cart</button><button class="btn" onclick="add('${p.id}',1)">Order now</button></div></div></section>`}
const qd=d=>{const q=$('#q');q.textContent=Math.max(1,+q.textContent+d)};
function add(id,go){const s=(document.querySelector('[name=sz]:checked')||{}).value||'',color=(document.querySelector('[name=color]:checked')||{}).value||'',q=+$('#q').textContent,c=cart(),x=c.find(i=>i.id==id&&i.s==s&&i.color==color);x?x.q+=q:c.push({id,s,color,q});setCart(c);go?location.hash='#/checkout':toast('Added to cart')}
function cartv(){const c=cart().filter(i=>P.find(x=>x.id==i.id));if(!c.length)return `<section class="sec c"><h2>Your cart is empty</h2><a class="btn" href="#/shop">Browse the shop</a></section>`;
return `<section class="sec nar"><h2>Your cart</h2>${c.map((i,n)=>{const p=P.find(x=>x.id==i.id);return `<div class="row"><div class="im sm">${img(p)}</div><div><h3>${esc(p.name)}</h3><small>Size ${esc(i.s)}${i.color?' · Color '+esc(i.color):''} · ${money(p.price)}</small><div class="qty" style="margin:6px 0 0"><button onclick="cq(${n},-1)">−</button><b>${i.q}</b><button onclick="cq(${n},1)">+</button></div></div><b>${money(p.price*i.q)}</b></div>`}).join('')}<div class="tot"><span>Subtotal</span><b>${money(sub())}</b></div><a class="btn" href="#/checkout">Checkout</a></section>`}
function cq(n,d){const c=cart();c[n].q+=d;if(c[n].q<1)c.splice(n,1);setCart(c);route()}
function checkout(){if(!cart().length)return cartv();
 const subtotal=sub();
 return `<section class="sec nar"><h2>Checkout</h2><form class="fm" onsubmit="place(event)"><input name="n" placeholder="Full name" required><input name="p" type="tel" placeholder="Phone (01XXXXXXXXX)" pattern="01[0-9]{9}" required><textarea name="a" rows="3" placeholder="Full address" required></textarea>
 <label>Delivery area<select name="delivery" id="deliveryArea" required onchange="updateCheckoutTotals()"><option value="60" selected>Inside Chittagong — ৳60</option><option value="120">Outside Chittagong — ৳120</option></select></label>
 <div class="pm"><label><input type="radio" name="m" value="Cash on Delivery" checked onchange="$('#tx').hidden=1"><span>Cash on delivery</span></label><label><input type="radio" name="m" value="bKash" onchange="$('#tx').hidden=0"><span>bKash</span></label><label><input type="radio" name="m" value="Nagad" onchange="$('#tx').hidden=0"><span>Nagad</span></label></div>
 <div id="tx" hidden class="fm"><small>${esc(S.pay)}</small><input name="x" placeholder="Transaction ID"></div><textarea name="o" rows="2" placeholder="Note (optional)"></textarea>
 <div class="tot"><span>Subtotal</span><b id="checkoutSubtotal">${money(subtotal)}</b></div><div class="tot"><span>Delivery</span><b id="checkoutDelivery">${money(60)}</b></div><div class="tot"><span>Total</span><b id="checkoutTotal">${money(subtotal+60)}</b></div><button class="btn">Place order</button></form></section>`}
function updateCheckoutTotals(){const fee=Number($('#deliveryArea')?.value)||0;const subtotal=sub();$('#checkoutSubtotal').textContent=money(subtotal);$('#checkoutDelivery').textContent=money(fee);$('#checkoutTotal').textContent=money(subtotal+fee)}
async function place(e){e.preventDefault();const f=new FormData(e.target),items=cart().map(i=>{const p=P.find(x=>x.id==i.id);return p&&{id:p.id,name:p.name,size:i.s,color:i.color||'',qty:i.q,price:p.price}}).filter(Boolean),delivery=Number(f.get('delivery'))||0,subtotal=sub(),total=subtotal+delivery;
const o={name:f.get('n'),phone:f.get('p'),addr:f.get('a'),pay:f.get('m'),trx:f.get('x')||'',note:f.get('o')||'',items,subtotal,ship:delivery,total,status:'New'};
e.target.querySelector('button').disabled=true;
try{const id=await API.addOrder(o);setCart([]);
const msg=`New order ${id}\n`+items.map(i=>`• ${i.name} (${i.size}${i.color?', '+i.color:''}) x${i.qty}`).join('\n')+`\nSubtotal: ${money(subtotal)}\nDelivery: ${money(delivery)}\nTotal: ${money(total)}\nName: ${o.name}\nPhone: ${o.phone}\nAddress: ${o.addr}\nPayment: ${o.pay} ${o.trx}`;

 if(!API.isAdmin())return app.innerHTML=`<section class="sec nar"><h2>Admin login</h2><form class="fm" onsubmit="login(event)">${db?'<input name="e" type="email" placeholder="Email" required>':''}<input name="p" type="password" placeholder="Password" required><button class="btn">Log in</button>${db?'':'<small>Demo password: admin123</small>'}</form></section>`;
 watch();const O=await API.orders();let h='';
 if(A.tab=='o')h=O.length?O.map(o=>`<div class="ord"><div><b>${esc(o.no||o.id)}</b> · ${new Date(o.t).toLocaleString()}<br><b>${esc(o.name)}</b> · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br>${esc(o.addr)}<br>${o.items.map(i=>`${esc(i.name)} (${esc(i.size)})${i.color?' · Color: '+esc(i.color):''} x${i.qty}`).join(', ')}<br>${esc(o.pay)} ${esc(o.trx)} · <b>${money(o.total)}</b>${o.note?'<br>Note: '+esc(o.note):''}</div><select onchange="API.setStatus('${o.id}',this.value)">${['New','Confirmed','Shipped','Delivered','Cancelled'].map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join(''):'<p>No orders yet. New orders appear here with a sound.</p>';
 if(A.tab=='p'){const e=P.find(x=>x.id==A.edit)||{};
  h=`<form class="fm" onsubmit="saveP(event)"><h3>${e.id?'Edit':'Add'} product</h3><input type="hidden" name="id" value="${e.id||''}"><input name="n" placeholder="Product name" value="${esc(e.name)}" required><input name="pr" type="number" placeholder="Price (৳)" value="${e.price||''}" required><input name="c" placeholder="Category (e.g. Panjabi)" value="${esc(e.cat)}" required><input name="sz" placeholder="Sizes: S,M,L,XL" value="${esc(e.sizes||'S,M,L,XL')}"><input name="colors" placeholder="Colors: Black, White, Navy (comma separated)" value="${esc(e.colors||'')}"><textarea name="d" rows="4" placeholder="Details">${esc(e.desc)}</textarea><label>Photos (up to 4${e.id?'; new photos replace old':''})<input name="im" type="file" accept="image/*" multiple></label><button class="btn">${e.id?'Update':'Add'} product</button></form><br>`+P.map(p=>`<div class="row"><div class="im sm">${img(p)}</div><div><b>${esc(p.name)}</b><br>${money(p.price)}</div><button class="btn o" onclick="A.edit='${p.id}';adm();scrollTo(0,0)">Edit</button><button class="btn o" onclick="delP('${p.id}')">Delete</button></div>`).join('')}
 if(A.tab=='s')h=`<form class="fm" onsubmit="saveS(event)">${[['hero','Home title'],['sub','Home subtitle'],['about','About text','t'],['wa','WhatsApp number (e.g. 8801700000000)'],['phone','Phone'],['addr','Address'],['ship','Delivery charge (৳)'],['pay','Bkash/Nagad instructions','t']].map(([k,l,t])=>`<label>${l}${t?`<textarea name="${k}" rows="4">${esc(S[k])}</textarea>`:`<input name="${k}" value="${esc(S[k])}">`}</label>`).join('')}<button class="btn">Save settings</button></form>`;
 app.innerHTML=`<section class="sec"><h2>Admin</h2><div class="tabs">${[['o','Orders ('+O.length+')'],['p','Products'],['s','Settings']].map(([k,l])=>`<button class="btn ${A.tab==k?'':'o'}" onclick="A.tab='${k}';A.edit=null;adm()">${l}</button>`).join('')}<button class="btn o" onclick="API.logout()">Log out</button></div>${h}</section>`}
async function saveP(e){e.preventDefault();const f=new FormData(e.target),old=P.find(x=>x.id==f.get('id'))||{},fl=[...e.target.im.files].slice(0,4),imgs=fl.length?await Promise.all(fl.map(pic)):old.imgs||[];
 await API.saveP({...old,id:f.get('id')||undefined,name:f.get('n'),price:+f.get('pr'),cat:f.get('c'),sizes:f.get('sz'),colors:f.get('colors'),desc:f.get('d'),imgs});A.edit=null;await load(1);adm();toast('Product saved')}
async function delP(id){if(confirm('Delete this product?')){await API.delP(id);await load(1);adm()}}
async function saveS(e){e.preventDefault();await API.saveS(Object.fromEntries(new FormData(e.target)));await load(1);adm();toast('Settings saved')}
